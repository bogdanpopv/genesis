research_task:
  description: >
    You are tasked with identifying the biggest community pain point or need that can be transformed into a saas, app, site or any other project type that a software developer can implement from the provided JSON file. Be thorough and ensure that the description is clear and full of details.
  expected_output: >
    Your response must follow this exact structure:
    ## Pain Point Description
    Thoroughly describe the pain point, including the community context.
    ## Stakeholders
    Identify the individuals or groups affected.
    ## Detailed Context
    Explain why this is an issue, providing specific examples from the data.
    ## Quote
    Include a quote that clearly represents the pain point or need.
    ## URL
    Include a url where the pain point or need can be found.


business_idea_task:
  description: >
    You have been provided with community pain points or needs. Keep the received content intact with no modifications. Continue by creating a detailed business idea that can be transformed into a saas, app, site or any other project type that a software developer can implement to address it. The response should be in-depth, focusing on practical aspects of the business and ensuring it covers all required areas comprehensively
  expected_output: >
    Your response must follow this exact structure:
    ## Business Name
    Provide a catchy and descriptive name for the business.
    ## Business Overview (at least 400 words)
    Describe the business, target users, how it addresses the pain point, and any unique features.
    ## Monetization Strategies (at least 400 words)
    Explain how the business can generate revenue.
    ## Market Analysis (at least 400 words)
    Discuss why this idea is viable. Include market trends, target audience, and projections.
    ## Revenue Opportunities
    Analyze potential revenue streams and include projected figures if possible.
